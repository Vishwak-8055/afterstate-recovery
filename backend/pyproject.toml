[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "afterstate"
version = "0.1.0"
description = "AFTERSTATE: recovery verification and resilience engineering platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.143.3",
  "uvicorn==0.54.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.0",
  "sqlalchemy==2.1.5",
  "alembic==1.20.0",
  "psycopg[binary]==3.3.6",
  "python-multipart==0.0.32",
  "httpx==0.28.1",
  "jinja2==3.1.6",
  "argon2-cffi==25.1.0",
  "croniter==6.2.4",
  "tzdata==2026.5",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-timeout==2.4.0",
  "pytest-cov==7.1.0",
  "ruff==0.17.1",
  "mypy==2.4.0",
  "pip-audit==2.10.1",
]

[project.scripts]
afterstate = "afterstate.cli:main"

[tool.setuptools.packages.find]
include = ["afterstate*"]

[tool.setuptools.package-data]
afterstate = ["engine/templates/*.html"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["afterstate", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM", "PL"]
ignore = [
  "S101",    # asserts are used in tests and invariants
  "PLR0913", # explicit keyword-only params are fine
  "PLR2004", # magic values in comparisons are fine
  "PLR0912", "PLR0915", "PLR0911", "PLR0914",
  "S603", "S607",  # subprocess is used deliberately: argv lists only, never a shell
  "B008",    # FastAPI Depends() defaults
  "E501",    # line length is owned by `ruff format`; long string literals are acceptable
  "PLR0917", # explicit keyword-only call style is used throughout
  "PLC0415", # local imports are deliberate where they avoid import cycles or heavy start-up cost
  "SIM105",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108", "S311", "PLC0415"]
"afterstate/lab/*" = ["S608"]
"alembic/*" = ["E501", "I001"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
exclude = ["alembic/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
timeout = 300
markers = [
  "integration: needs real PostgreSQL binaries (initdb/pg_restore); run as a non-root user",
  "slow: takes more than a few seconds",
]
filterwarnings = ["error::sqlalchemy.exc.SAWarning"]
